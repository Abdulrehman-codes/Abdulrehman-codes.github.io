<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MorTal BeAst</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font: 16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #fdf6f2; color: #2b211d;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #17110f; color: #f2e7e1; }
    .card { background: #221a17 !important; }
    a { color: #e8a87c !important; }
  }
  .card {
    background: #fff; padding: 40px 36px; border-radius: 18px;
    max-width: 460px; margin: 24px;
    box-shadow: 0 2px 24px rgba(0,0,0,.07);
  }
  .mark {
    width: 62px; height: 62px; border-radius: 16px;
    background: #8a4b2a; color: #ffe8d8;
    display: grid; place-items: center;
    font-weight: 700; font-size: 22px; letter-spacing: 1px;
    margin-bottom: 20px;
  }
  h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .5px; }
  p  { margin: 0 0 14px; opacity: .85; }
  a  { color: #8a4b2a; }
  ul { padding-left: 18px; margin: 8px 0 0; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">MB</div>
    <h1>MorTal BeAst</h1>
    <p>Small, offline-friendly puzzle games for Android.</p>
    <p>
      <a href="/rang/"><strong>Play Rang in your browser</strong></a> &mdash;
      court piece online, with friends or bots.
    </p>
    <p>
      <a href="https://abdulrehman-codes.github.io/mortalbeast/privacy-policy.html">Privacy policy</a>
      &middot;
      <a href="mailto:baigabdulrehman21@gmail.com">Contact</a>
    </p>
  </main>
</body>
</html>
